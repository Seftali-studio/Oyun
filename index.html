<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Otobüs Simülatörü - Ege Turizm</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px;
            pointer-events: none;
        }
        .btn-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        button { padding: 12px 20px; font-weight: bold; background: #eab308; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #ca8a04; }
    </style>
    <!-- Three.js 3D Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
    <h2>🚌 3D Yolculuk Modu</h2>
    <p>Para: <span id="para">5000</span> ₺</p>
    <p>Durum: <span id="durum">Yolda Sürüş Yapılıyor... (W/S ile hızlan)</span></p>
</div>

<div class="btn-panel">
    <button onclick="ikramDagit()">🧃 İkram Dağıt (Su/Kek)</button>
    <button onclick="oyunuKaydet()" style="background: #22c55e; color:white;">💾 Kaydet</button>
</div>

<script>
    let oyun = { para: 5000, skor: 0 };
    
    // --- 3D SAHNE KURULUMU (THREE.JS) ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Gökyüzü mavisi

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Işık
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // Yol
    const yolGeo = new THREE.PlaneGeometry(10, 1000);
    const yolMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
    const yol = new THREE.Mesh(yolGeo, yolMat);
    yol.rotation.x = -Math.PI / 2;
    scene.add(yol);

    // Otobüs (Basit 3D Kutu Temsili - İleride detaylı 3D model ekleyebiliriz)
    const otobusGeo = new THREE.BoxGeometry(2, 2, 5);
    const otobusMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
    const otobüs = new THREE.Mesh(otobusGeo, otobusMat);
    otobüs.position.set(0, 1, 0);
    scene.add(otobüs);

    camera.position.set(0, 5, -8);
    camera.lookAt(otobüs.position);

    // Hareket Kontrolleri
    let hiz = 0;
    let tuslar = { ileri: false, geri: false };

    window.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') tuslar.ileri = true;
        if (e.key === 's' || e.key === 'ArrowDown') tuslar.geri = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') tuslar.ileri = false;
        if (e.key === 's' || e.key === 'ArrowDown') tuslar.geri = false;
    });

    // Kayıt Yükleme
    window.onload = function() {
        const kayit = localStorage.getItem("sim3dSave");
        if(kayit) {
            oyun = JSON.parse(kayit);
            document.getElementById("para").innerText = oyun.para;
        }
    }

    function oyunuKaydet() {
        localStorage.setItem("sim3dSave", JSON.stringify(oyun));
        alert("Oyun kaydedildi!");
    }

    function ikramDagit() {
        oyun.para += 150;
        document.getElementById("para").innerText = oyun.para;
        alert("Harika! Yolculara su ve kek ikram edildi, memnuniyet arttı (+150 ₺).");
        oyunuKaydet();
    }

    // Oyun Döngüsü (Animation Loop)
    function animate() {
        requestAnimationFrame(animate);

        if (tuslar.ileri) hiz = 0.2;
        else if (tuslar.geri) hiz = -0.1;
        else hiz *= 0.95; // Sürtünme

        otobüs.position.z += hiz;
        camera.position.z = otobüs.position.z - 8;

        renderer.render(scene, camera);
    }
    animate();
</script>

</body>
</html>
